name: villa_manager
description: Offline villa catalog, booking & invoice manager for marketers.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.22.1
  path_provider: ^2.1.5
  path: ^1.9.1
  go_router: ^14.6.2
  intl: ^0.20.3
  uuid: ^4.5.1
  image_picker: ^1.2.3
  image: ^4.9.1
  file_selector: ^1.1.0
  video_player: ^2.14.0
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          style: italic
